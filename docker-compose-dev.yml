from __future__ import annotations

from typing import Any, Dict, List, Optional

from fastapi import FastAPI, HTTPException, BackgroundTasks
from fastapi.middleware.cors import CORSMiddleware
from pydantic import BaseModel

from app.database import get_connection, init_db, seed_documents
from app.ingestion import build_document_from_source, extract_text_from_url, fetch_url_metadata, serialize_metadata
from app.semantic import extract_events_from_text, compute_semantic_similarity, extract_key_phrases
from app.tasks import celery_app, ingest_and_extract_text, extract_events_task, compare_documents_task

app = FastAPI(title="Sacred Timeline MVP with extraction and semantic analysis")

app.add_middleware(
    CORSMiddleware,
    allow_origins=["*"],
    allow_credentials=True,
    allow_methods=["*"],
    allow_headers=["*"],
)


class DocumentInput(BaseModel):
    title: str
    religion: str
    tradition: Optional[str] = None
    language: Optional[str] = None
    source: Optional[str] = None
    source_url: Optional[str] = None
    category: Optional[str] = None
    date_start: Optional[int] = None
    date_end: Optional[int] = None
    summary: Optional[str] = None
    body_text: Optional[str] = None
    status: str = "ingested"


class SourceIngestInput(BaseModel):
    source_url: str
    religion: Optional[str] = None
    source_name: Optional[str] = None


@app.on_event("startup")
def startup_event() -> None:
    init_db()
    seed_documents()


@app.get("/health")
def health_check() -> Dict[str, str]:
    return {"status": "ok", "service": "sacred-timeline"}


@app.get("/api/documents")
def get_documents() -> List[Dict[str, Any]]:
    with get_connection() as conn:
        if hasattr(conn, "execute"):
            rows = conn.execute(
                "SELECT * FROM documents ORDER BY COALESCE(date_start, 0) ASC, title ASC"
            ).fetchall()
            return [dict(row) for row in rows]
        with conn.cursor() as cur:
            cur.execute("SELECT * FROM documents ORDER BY COALESCE(date_start, 0) ASC, title ASC")
            rows = cur.fetchall()
            return [dict(row) for row in rows]


@app.get("/api/documents/{document_id}")
def get_document(document_id: int) -> Dict[str, Any]:
    with get_connection() as conn:
        if hasattr(conn, "execute"):
            row = conn.execute("SELECT * FROM documents WHERE id = ?", (document_id,)).fetchone()
            if row is None:
                raise HTTPException(status_code=404, detail="Document not found")
            return dict(row)
        with conn.cursor() as cur:
            cur.execute("SELECT * FROM documents WHERE id = %s", (document_id,))
            row = cur.fetchone()
            if row is None:
                raise HTTPException(status_code=404, detail="Document not found")
            return dict(row)


@app.get("/api/documents/{document_id}/events")
def get_document_events(document_id: int) -> Dict[str, Any]:
    with get_connection() as conn:
        if hasattr(conn, "execute"):
            rows = conn.execute(
                "SELECT * FROM extracted_events WHERE document_id = ? ORDER BY created_at DESC",
                (document_id,),
            ).fetchall()
            events = [dict(row) for row in rows]
        else:
            with conn.cursor() as cur:
                cur.execute(
                    "SELECT * FROM extracted_events WHERE document_id = %s ORDER BY created_at DESC",
                    (document_id,),
                )
                events = [dict(row) for row in cur.fetchall()]
    return {"document_id": document_id, "events": events}


@app.post("/api/documents/{document_id}/extract-text-async")
def queue_text_extraction(document_id: int) -> Dict[str, Any]:
    doc = get_document(document_id)
    if not doc.get("source_url"):
        raise HTTPException(status_code=400, detail="This document has no source URL for text extraction")
    task = ingest_and_extract_text.delay(document_id, doc["source_url"])
    return {"status": "queued", "task_id": task.id, "document_id": document_id}


@app.post("/api/documents/{document_id}/extract-events")
def queue_event_extraction(document_id: int) -> Dict[str, Any]:
    doc = get_document(document_id)
    if not doc.get("body_text"):
        raise HTTPException(status_code=400, detail="This document has no text body to extract events from")
    task = extract_events_task.delay(document_id, doc["body_text"])
    return {"status": "queued", "task_id": task.id, "document_id": document_id}


@app.get("/api/compare-semantic")
def compare_semantic(ids: str) -> Dict[str, Any]:
    document_ids = [int(part.strip()) for part in ids.split(",") if part.strip()]
    if len(document_ids) < 2:
        raise HTTPException(status_code=400, detail="Provide at least two document IDs")

    docs = [get_document(document_id) for document_id in document_ids[:2]]
    left, right = docs
    text1 = left.get("body_text") or ""
    text2 = right.get("body_text") or ""

    similarity = compute_semantic_similarity(text1, text2)
    left_phrases = extract_key_phrases(text1)
    right_phrases = extract_key_phrases(text2)
    shared_phrases = set(left_phrases) & set(right_phrases)

    return {
        "documents": [left, right],
        "semantic_similarity": float(similarity),
        "left_key_phrases": left_phrases,
        "right_key_phrases": right_phrases,
        "shared_phrases": list(shared_phrases),
    }


@app.post("/api/compare-async")
def queue_comparison(ids: str) -> Dict[str, Any]:
    document_ids = [int(part.strip()) for part in ids.split(",") if part.strip()]
    if len(document_ids) < 2:
        raise HTTPException(status_code=400, detail="Provide at least two document IDs")
    task = compare_documents_task.delay(document_ids[0], document_ids[1])
    return {"status": "queued", "task_id": task.id}


@app.get("/api/compare")
def compare_documents(ids: str) -> Dict[str, Any]:
    document_ids = [int(part.strip()) for part in ids.split(",") if part.strip()]
    if len(document_ids) < 2:
        raise HTTPException(status_code=400, detail="Provide at least two document IDs")

    docs = [get_document(document_id) for document_id in document_ids[:2]]
    left, right = docs
    comparable = {
        "shared_religion": left.get("religion") == right.get("religion"),
        "same_language": left.get("language") == right.get("language"),
        "same_tradition": left.get("tradition") == right.get("tradition"),
        "date_overlap": (
            left.get("date_start") is not None
            and right.get("date_end") is not None
            and left.get("date_start") <= right.get("date_end")
            and right.get("date_start") <= left.get("date_end")
        ),
        "left_title": left.get("title"),
        "right_title": right.get("title"),
        "left_summary": left.get("summary"),
        "right_summary": right.get("summary"),
    }
    return {"documents": docs, "comparison": comparable}


@app.post("/api/documents")
def create_document(payload: DocumentInput) -> Dict[str, Any]:
    with get_connection() as conn:
        if hasattr(conn, "execute"):
            cursor = conn.execute(
                """
                INSERT INTO documents (
                    title, religion, tradition, language, source, source_url, category,
                    date_start, date_end, summary, body_text, status
                ) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)
                """,
                (
                    payload.title,
                    payload.religion,
                    payload.tradition,
                    payload.language,
                    payload.source,
                    payload.source_url,
                    payload.category,
                    payload.date_start,
                    payload.date_end,
                    payload.summary,
                    payload.body_text,
                    payload.status,
                ),
            )
            conn.commit()
            doc_id = cursor.lastrowid
            row = conn.execute("SELECT * FROM documents WHERE id = ?", (doc_id,)).fetchone()
            return dict(row)

        with conn.cursor() as cur:
            cur.execute(
                """
                INSERT INTO documents (
                    title, religion, tradition, language, source, source_url, category,
                    date_start, date_end, summary, body_text, status
                ) VALUES (%s, %s, %s, %s, %s, %s, %s, %s, %s, %s, %s, %s)
                RETURNING *
                """,
                (
                    payload.title,
                    payload.religion,
                    payload.tradition,
                    payload.language,
                    payload.source,
                    payload.source_url,
                    payload.category,
                    payload.date_start,
                    payload.date_end,
                    payload.summary,
                    payload.body_text,
                    payload.status,
                ),
            )
            row = cur.fetchone()
            conn.commit()
            return dict(row)


@app.post("/api/ingest-source")
async def ingest_source(payload: SourceIngestInput) -> Dict[str, Any]:
    metadata = await fetch_url_metadata(payload.source_url)
    doc_payload = build_document_from_source(
        payload.source_url,
        religion=payload.religion,
        source_name=payload.source_name or metadata.get("title") or "Imported source",
    )
    doc_payload["body_text"] = metadata.get("body_text") or ""

    with get_connection() as conn:
        if hasattr(conn, "execute"):
            conn.execute(
                """
                INSERT INTO sources (name, url, religion, source_type, metadata, status)
                VALUES (?, ?, ?, ?, ?, 'queued')
                """,
                (
                    metadata.get("title") or payload.source_name or "Imported source",
                    payload.source_url,
                    payload.religion,
                    metadata.get("source_type") or "generic",
                    serialize_metadata(metadata),
                ),
            )
            conn.commit()
            cursor = conn.execute(
                """
                INSERT INTO documents (
                    title, religion, tradition, language, source, source_url, category,
                    date_start, date_end, summary, body_text, status
                ) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)
                """,
                (
                    doc_payload["title"],
                    doc_payload["religion"],
                    doc_payload["tradition"],
                    doc_payload["language"],
                    doc_payload["source"],
                    doc_payload["source_url"],
                    doc_payload["category"],
                    doc_payload["date_start"],
                    doc_payload["date_end"],
                    doc_payload["summary"],
                    doc_payload["body_text"],
                    doc_payload["status"],
                ),
            )
            conn.commit()
            doc_id = cursor.lastrowid
        else:
            with conn.cursor() as cur:
                cur.execute(
                    """
                    INSERT INTO sources (name, url, religion, source_type, metadata, status)
                    VALUES (%s, %s, %s, %s, %s, %s)
                    """,
                    (
                        metadata.get("title") or payload.source_name or "Imported source",
                        payload.source_url,
                        payload.religion,
                        metadata.get("source_type") or "generic",
                        serialize_metadata(metadata),
                        "queued",
                    ),
                )
                cur.execute(
                    """
                    INSERT INTO documents (
                        title, religion, tradition, language, source, source_url, category,
                        date_start, date_end, summary, body_text, status
                    ) VALUES (%s, %s, %s, %s, %s, %s, %s, %s, %s, %s, %s, %s)
                    RETURNING id
                    """,
                    (
                        doc_payload["title"],
                        doc_payload["religion"],
                        doc_payload["tradition"],
                        doc_payload["language"],
                        doc_payload["source"],
                        doc_payload["source_url"],
                        doc_payload["category"],
                        doc_payload["date_start"],
                        doc_payload["date_end"],
                        doc_payload["summary"],
                        doc_payload["body_text"],
                        doc_payload["status"],
                    ),
                )
                doc_id = cur.fetchone()[0]
                conn.commit()

    if doc_id:
        ingest_and_extract_text.delay(doc_id, payload.source_url)

    return {
        "status": "queued",
        "document_id": doc_id,
        "document": doc_payload,
        "metadata": metadata,
    }


@app.get("/api/timeline")
def get_timeline() -> List[Dict[str, Any]]:
    with get_connection() as conn:
        if hasattr(conn, "execute"):
            rows = conn.execute(
                "SELECT * FROM documents WHERE date_start IS NOT NULL OR date_end IS NOT NULL ORDER BY COALESCE(date_start, 0) ASC"
            ).fetchall()
            return [dict(row) for row in rows]
        with conn.cursor() as cur:
            cur.execute(
                "SELECT * FROM documents WHERE date_start IS NOT NULL OR date_end IS NOT NULL ORDER BY COALESCE(date_start, 0) ASC"
            )
            rows = cur.fetchall()
            return [dict(row) for row in rows]


@app.get("/api/dashboard")
def dashboard_data() -> Dict[str, Any]:
    with get_connection() as conn:
        if hasattr(conn, "execute"):
            documents = conn.execute("SELECT * FROM documents ORDER BY COALESCE(date_start, 0) ASC, title ASC").fetchall()
            docs = [dict(row) for row in documents]
        else:
            with conn.cursor() as cur:
                cur.execute("SELECT * FROM documents ORDER BY COALESCE(date_start, 0) ASC, title ASC")
                documents = cur.fetchall()
                docs = [dict(row) for row in documents]

    religions = sorted({doc["religion"] for doc in docs})
    statuses = sorted({doc["status"] for doc in docs})
    min_year = min((doc["date_start"] for doc in docs if doc.get("date_start") is not None), default=0)
    max_year = max((doc["date_end"] for doc in docs if doc.get("date_end") is not None), default=0)

    return {
        "documents": docs,
        "stats": {
            "total_documents": len(docs),
            "religions": len(religions),
            "traditions": len({doc["tradition"] for doc in docs if doc.get("tradition")}),
            "statuses": len(statuses),
            "earliest_year": min_year,
            "latest_year": max_year,
        },
        "religion_breakdown": [
            {"religion": religion, "count": sum(1 for doc in docs if doc["religion"] == religion)}
            for religion in religions
        ],
    }


