const apiBase = '/api';
const state = {
  documents: [],
  selectedId: null,
  comparisonIds: [],
};

function formatRange(row) {
  const start = row.date_start ?? 'n/a';
  const end = row.date_end ?? 'n/a';
  return `${start}–${end}`;
}

function populateReligionFilter(documents) {
  const select = document.getElementById('religionFilter');
  const religions = [...new Set(documents.map((doc) => doc.religion).filter(Boolean))].sort();
  const current = select.value;
  select.innerHTML = '<option value="">All religions</option>' + religions
    .map((religion) => `<option value="${religion}">${religion}</option>`)
    .join('');
  if (religions.includes(current)) {
    select.value = current;
  }
}

function renderStats(stats) {
  document.getElementById('totalDocuments').textContent = stats.total_documents;
  document.getElementById('totalReligions').textContent = stats.religions;
  document.getElementById('totalTraditions').textContent = stats.traditions;
  document.getElementById('timelineSpan').textContent = `${stats.earliest_year}–${stats.latest_year}`;
}

function renderBreakdown(breakdown) {
  const container = document.getElementById('religionBreakdown');
  const colors = ['#34d399', '#60a5fa', '#fbbf24', '#f472b6', '#f87171', '#a78bfa'];
  container.innerHTML = breakdown
    .map(
      (item, index) => `
        <div class="breakdown-row">
          <div class="breakdown-label">
            <span class="dot" style="background:${colors[index % colors.length]}"></span>
            <span>${item.religion}</span>
          </div>
          <strong>${item.count}</strong>
        </div>
      `
    )
    .join('');
}

function renderTimeline(items) {
  const container = document.getElementById('timeline');
  const fullItems = items.slice(0, 8);
  const maxSpread = Math.max(
    1,
    ...fullItems.map((item) => Math.max(1, Math.abs((item.date_end || item.date_start || 0) - (item.date_start || item.date_end || 0)) || 20))
  );

  container.innerHTML = fullItems
    .map((item) => {
      const start = item.date_start ?? 0;
      const end = item.date_end ?? start;
      const spread = Math.max(20, Math.abs(end - start) || 20);
      const height = Math.min(180, (spread / maxSpread) * 160 + 30);
      return `
        <div class="timeline-item">
          <div class="timeline-bar" style="height:${height}px"></div>
          <small>${item.title.length > 18 ? item.title.substring(0, 18) + '…' : item.title}</small>
        </div>
      `;
    })
    .join('');
}

function getFilteredDocuments() {
  const religionFilter = document.getElementById('religionFilter').value;
  const searchTerm = document.getElementById('searchInput').value.trim().toLowerCase();

  return state.documents.filter((doc) => {
    const matchesReligion = !religionFilter || doc.religion === religionFilter;
    const haystack = [doc.title, doc.religion, doc.tradition, doc.language, doc.source, doc.summary]
      .filter(Boolean)
      .join(' ')
      .toLowerCase();
    const matchesSearch = !searchTerm || haystack.includes(searchTerm);
    return matchesReligion && matchesSearch;
  });
}

function renderDocuments() {
  const filtered = getFilteredDocuments();
  const list = document.getElementById('documentList');
  list.innerHTML = filtered
    .map(
      (doc) => `
        <article class="document-card ${doc.id === state.selectedId ? 'selected' : ''}">
          <div class="meta">
            <span class="badge">${doc.religion}</span>
            <span class="badge">${doc.language || 'Unspecified'}</span>
            <span class="badge">${doc.status || 'ingested'}</span>
          </div>
          <h3>${doc.title}</h3>
          <p><strong>${formatRange(doc)}</strong></p>
          <p>${doc.summary || 'No summary available yet.'}</p>
          <p><em>${doc.source || 'Unknown source'}</em></p>
          <div class="meta">
            <button data-action="view" data-id="${doc.id}">View</button>
            <button data-action="compare" data-id="${doc.id}">Compare</button>
          </div>
        </article>
      `
    )
    .join('');

  if (!filtered.some((doc) => doc.id === state.selectedId) && filtered.length) {
    state.selectedId = filtered[0].id;
  }

  renderSelectedDocument();
  renderComparison();
}

async function renderSelectedDocument() {
  const container = document.getElementById('selectedDocument');
  if (!state.selectedId) {
    container.classList.add('empty-state');
    container.textContent = 'Select a document to inspect its metadata and chronology.';
    return;
  }

  const doc = state.documents.find((item) => item.id === state.selectedId);
  if (!doc) {
    return;
  }

  container.classList.remove('empty-state');
  container.innerHTML = `
    <div class="detail-card">
      <h3>${doc.title}</h3>
      <p><strong>${doc.religion}</strong> · ${doc.tradition || 'Unspecified tradition'} · ${doc.language || 'Unknown language'}</p>
      <p>${doc.summary || 'No summary available yet.'}</p>
      <div class="detail-grid">
        <div><strong>Source</strong><br />${doc.source || 'Unknown'}</div>
        <div><strong>URL</strong><br /><a href="${doc.source_url || '#'}" target="_blank" rel="noreferrer">${doc.source_url || 'Not provided'}</a></div>
        <div><strong>Date range</strong><br />${formatRange(doc)}</div>
        <div><strong>Status</strong><br />${doc.status || 'ingested'}</div>
      </div>
    </div>
  `;
}

function renderComparison() {
  const container = document.getElementById('comparisonPanel');
  if (state.comparisonIds.length < 2) {
    container.classList.add('empty-state');
    container.textContent = 'Select two documents from the library to compare them side-by-side.';
    return;
  }

  const docs = state.comparisonIds
    .map((id) => state.documents.find((doc) => doc.id === id))
    .filter(Boolean);

  if (docs.length < 2) {
    container.textContent = 'Need two valid documents to compare.';
    return;
  }

  const [left, right] = docs;
  const comparison = {
    sharedReligion: left.religion === right.religion,
    sameLanguage: left.language === right.language,
    sameTradition: left.tradition === right.tradition,
    dateOverlap: left.date_start != null && right.date_end != null && left.date_start <= right.date_end && right.date_start <= left.date_end,
  };

  container.classList.remove('empty-state');
  container.innerHTML = `
    <div class="compare-grid">
      <div class="compare-box">
        <h4>${left.title}</h4>
        <p>${left.summary || 'No summary available.'}</p>
      </div>
      <div class="compare-box">
        <h4>${right.title}</h4>
        <p>${right.summary || 'No summary available.'}</p>
      </div>
    </div>
    <div class="detail-grid" style="margin-top: 16px;">
      <div><strong>Same religion</strong><br />${comparison.sharedReligion ? 'Yes' : 'No'}</div>
      <div><strong>Same language</strong><br />${comparison.sameLanguage ? 'Yes' : 'No'}</div>
      <div><strong>Same tradition</strong><br />${comparison.sameTradition ? 'Yes' : 'No'}</div>
      <div><strong>Date overlap</strong><br />${comparison.dateOverlap ? 'Yes' : 'No'}</div>
    </div>
  `;
}

async function loadDashboard() {
  const response = await fetch(`${apiBase}/dashboard`);
  const data = await response.json();
  state.documents = data.documents;
  if (!state.selectedId && state.documents.length) {
    state.selectedId = state.documents[0].id;
  }
  if (state.comparisonIds.length < 2 && state.documents.length >= 2) {
    state.comparisonIds = state.documents.slice(0, 2).map((doc) => doc.id);
  }

  renderStats(data.stats);
  renderBreakdown(data.religion_breakdown);
  renderTimeline(data.documents);
  populateReligionFilter(data.documents);
  renderDocuments();
}

async function submitSource(event) {
  event.preventDefault();
  const form = event.target;
  const payload = Object.fromEntries(new FormData(form).entries());

  const response = await fetch(`${apiBase}/ingest-source`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload),
  });

  if (response.ok) {
    form.reset();
    await loadDashboard();
  }
}

async function submitDocument(event) {
  event.preventDefault();
  const form = event.target;
  const payload = Object.fromEntries(new FormData(form).entries());

  const response = await fetch(`${apiBase}/documents`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload),
  });

  if (response.ok) {
    form.reset();
    await loadDashboard();
  }
}

document.getElementById('refreshBtn').addEventListener('click', loadDashboard);
document.getElementById('searchInput').addEventListener('input', renderDocuments);
document.getElementById('religionFilter').addEventListener('change', renderDocuments);

document.getElementById('documentList').addEventListener('click', (event) => {
  const button = event.target.closest('button');
  if (!button) return;
  const id = Number(button.dataset.id);
  const action = button.dataset.action;

  if (action === 'view') {
    state.selectedId = id;
    renderDocuments();
  }

  if (action === 'compare') {
    if (!state.comparisonIds.includes(id)) {
      state.comparisonIds = [...state.comparisonIds, id].slice(-2);
    }
    renderComparison();
  }
});

document.getElementById('sourceForm').addEventListener('submit', submitSource);
document.getElementById('documentForm').addEventListener('submit', submitDocument);

loadDashboard();

